<!doctype html><html lang="pt-BR"><head><base href="file:///home/user/Hamburgueria/growlift-social/_fonte/assets/"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--w:1080px;--h:1920px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--w);height:var(--h);overflow:hidden}
body{position:relative;font-family:Inter,system-ui,sans-serif;color:#f3f5f9;background:#06080d;-webkit-font-smoothing:antialiased}
.glow{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(8,101,254,.42),rgba(8,101,254,0) 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:72px 72px;-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 25%,transparent 72%)}
.eyebrow{font-size:28px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#6ea6ff}
.h1{font-weight:800;letter-spacing:-.035em;line-height:.98}
.blue{color:#4d8dff}
.lead{color:#c6cede;line-height:1.4}
.muted{color:#a9b3c7}
.chip{display:inline-flex;align-items:center;gap:12px;border:1px solid rgba(141,184,255,.35);color:#8db8ff;border-radius:999px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;background:#0865fe;color:#fff;border-radius:999px;font-weight:700;box-shadow:0 24px 50px -20px rgba(8,101,254,.9)}
.card{background:#0f1520;border:1px solid rgba(255,255,255,0.10);border-radius:32px}
.brand{display:flex;align-items:center;gap:16px;font-weight:700;letter-spacing:.12em}
.brand svg{height:1.05em;width:auto}
.browser{border-radius:26px;overflow:hidden;background:#0f1520;border:1px solid rgba(255,255,255,0.10);box-shadow:0 -30px 90px -30px rgba(8,101,254,.55),0 40px 80px -40px rgba(0,0,0,.9)}
.browser .bar{display:flex;align-items:center;gap:10px;height:54px;padding:0 22px;border-bottom:1px solid rgba(255,255,255,.08)}
.browser .bar i{width:14px;height:14px;border-radius:50%;background:#2a3344}
.browser .bar span{margin-left:14px;font-size:20px;color:#7d879c;background:#161d2a;padding:6px 18px;border-radius:999px}
.browser img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.phone{border-radius:64px;padding:16px;background:#1a2130;box-shadow:0 50px 90px -40px rgba(0,0,0,.95),0 0 0 2px rgba(255,255,255,.06)}
.phone img{display:block;width:100%;border-radius:50px}
.tag-conceito{display:inline-block;font-size:22px;font-weight:600;letter-spacing:.06em;color:#8790a6;border:1px dashed rgba(255,255,255,.22);border-radius:999px;padding:8px 18px}
