<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:800px;overflow:hidden;background:#0b0907;color:#f4ead8;font-family:Inter,sans-serif}
nav{display:flex;align-items:center;justify-content:space-between;padding:26px 56px}
.logo{font-family:Anton,sans-serif;font-size:30px;letter-spacing:.04em;color:#e8b04a}.logo span{color:#f4ead8}
.links{display:flex;gap:34px;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#cbbfa8}
.cart{display:flex;gap:10px;align-items:center}.cart b{background:#e8b04a;color:#140f08;border-radius:99px;padding:10px 20px;font-size:14px}
.hero{position:relative;height:690px;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:0 56px}
h1{font-family:Anton,sans-serif;font-size:118px;line-height:.92;text-transform:uppercase;letter-spacing:.01em}h1 em{font-style:normal;color:#e8b04a}
p.sub{margin-top:22px;font-size:19px;line-height:1.5;color:#cbbfa8;max-width:470px}
.cta{display:flex;gap:14px;margin-top:34px}.cta b{background:#e8b04a;color:#140f08;padding:17px 30px;border-radius:99px;font-size:16px}.cta i{font-style:normal;border:1px solid #6d5a3b;padding:16px 28px;border-radius:99px;font-size:16px;font-weight:600}
.pic{position:relative;height:620px}.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent)}
.price{position:absolute;right:40px;bottom:110px;background:#16110b;border:1px solid #3a2e1d;border-radius:18px;padding:16px 22px}.price small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#a8977a}.price b{font-size:28px;color:#e8b04a}
.glow{position:absolute;right:120px;top:120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(closest-side,rgba(232,176,74,.22),transparent)}
</style></head><body>
<nav><div class="logo">BRASA<span> BURGER</span></div><div class="links"><span>Cardápio</span><span>Combos</span><span>Sobre</span><span>Contato</span></div><div class="cart"><b>Pedir agora</b></div></nav>
<section class="hero"><div><h1>O burger<br>que vale<br><em>a fila.</em></h1><p class="sub">Blend da casa na brasa, pão brioche e queijo de verdade. Peça pelo site e acompanhe a entrega.</p><div class="cta"><b>Ver cardápio</b><i>Fazer pedido</i></div></div>
<div class="pic"><div class="glow"></div><img src="burger.png" alt=""><div class="price"><small>Brasa Duplo</small><b>R$ 39,90</b></div></div></section>
</body></html>
